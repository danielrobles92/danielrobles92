<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14122b"/>
      <stop offset="0.55" stop-color="#3b1f4f"/>
      <stop offset="1" stop-color="#6b2d5c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d29b"/>
      <stop offset="0.6" stop-color="#f78ca0"/>
      <stop offset="1" stop-color="#c7a4f5"/>
