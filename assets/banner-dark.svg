    <line x1="0" y1="178" x2="960" y2="178"/>
    <line x1="0" y1="192" x2="960" y2="192"/>
    <line x1="0" y1="212" x2="960" y2="212"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="480" y1="168" x2="480" y2="260"/>
    <line x1="480" y1="168" x2="360" y2="260"/><line x1="480" y1="168" x2="600" y2="260"/>
    <line x1="480" y1="168" x2="220" y2="260"/><line x1="480" y1="168" x2="740" y2="260"/>
    <line x1="480" y1="168" x2="60" y2="260"/><line x1="480" y1="168" x2="900" y2="260"/>
